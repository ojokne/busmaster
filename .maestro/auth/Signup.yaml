appId: com.oen.busmaster
---

# Test 1: Invalid Email Format
- clearState
- launchApp
- tapOn: 
    id: 'signupLink'
- tapOn:
    id: email
- inputText: invalid-email
- tapOn:
    id: password
- inputText: password123
- tapOn:
    id: signupButton
- assertVisible:
    text: Invalid email address
- clearState

# Test 2: Short Password
- launchApp
- tapOn: 
    id: 'signupLink'
- tapOn:
    id: email
- inputText: test@example.com
- tapOn:
    id: password
- inputText: 123
- tapOn:
    id: signupButton
- assertVisible:
    text: Password must be at least 6 characters.
- clearState

# Test 3: Valid Sign Up
- launchApp
- tapOn: 
    id: 'signupLink'
- tapOn:
    id: 'email'
- inputText: 'test@example.com'
- tapOn:
    id: 'password'
- inputText: 'password123'
- tapOn:
    id: 'togglePassword'
- tapOn:
    id: 'signupButton'
- clearState

# Test 4: Signin link
- launchApp
- tapOn: 
    id: 'signupLink'
- tapOn: 
    id: 'signinLink'
- clearState